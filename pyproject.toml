[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "portable-slm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "safetensors>=0.4", "torch>=2.5"]

[project.optional-dependencies]
mlx = ["mlx>=0.22; sys_platform == 'darwin' and platform_machine == 'arm64'"]
dev = ["pytest>=8"]
tokenizer = ["tokenizers==0.22.2"]
teacher = ["jsonschema==4.26.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/slm"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
